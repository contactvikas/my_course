services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file: .env.local          # server-side secrets, read at runtime only
    ports:
      - "127.0.0.1:3000:3000"     # localhost only; VS Code port-forward for testing
    restart: unless-stopped
